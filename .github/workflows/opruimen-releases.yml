# Eenmalig: oude GitHub-releases en -tags van Tunr verwijderen (builds staan nu op beheer.tunr.online).
name: Opruimen releases
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  opruimen:
    runs-on: ubuntu-latest
    steps:
      - name: Releases en tags verwijderen
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          for id in $(gh api "repos/$R/releases" --paginate --jq '.[].id'); do gh api -X DELETE "repos/$R/releases/$id" && echo "release $id weg"; done
          for t in $(gh api "repos/$R/tags" --paginate --jq '.[].name'); do gh api -X DELETE "repos/$R/git/refs/tags/$t" && echo "tag $t weg"; done
          echo "::notice::Releases: $(gh api "repos/$R/releases" --jq length), tags: $(gh api "repos/$R/tags" --jq length)"
