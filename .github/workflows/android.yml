name: Android

# Bouwt de Android-app (telefoon, tablet, Android TV en Android Auto in één APK) bij elke push die android/ raakt.
# Als de build slaagt: de APK (Tunr-<versie>-build<N>.apk) en de AAB voor Google Play (Tunr-<versie>-build<N>.aab)
# naar beheer.tunr.online (tab Downloads, onderdelen Android en Google Play), via
# tools/beheer_upload.sh uit tunr-beheer. Nooit op GitHub (geen repo, geen release, geen artefact).
# Secrets: FTP_SERVER, BEHEER_FTP_USERNAME, BEHEER_FTP_PASSWORD (zonder: overslaan met een waarschuwing).
# Ondertekening: met de eigen release-sleutel uit de secrets TUNR_KEYSTORE_BASE64, TUNR_KEYSTORE_PASSWORD
# (en optioneel TUNR_KEY_ALIAS, TUNR_KEY_PASSWORD). Zonder die secrets met android/ci-debug.keystore,
# zodat elke APK in elk geval met dezelfde sleutel is getekend en updates over elkaar heen installeren.
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Ondertekensleutel klaarzetten
        env:
          KS_B64: ${{ secrets.TUNR_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.TUNR_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.TUNR_KEY_ALIAS }}
          KEY_PW: ${{ secrets.TUNR_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PW" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/tunr-release.jks"
            echo "TUNR_KEYSTORE=$RUNNER_TEMP/tunr-release.jks" >> $GITHUB_ENV
            echo "TUNR_KEYSTORE_PASSWORD=$KS_PW" >> $GITHUB_ENV
            echo "TUNR_KEY_ALIAS=${KS_ALIAS:-tunr}" >> $GITHUB_ENV
            echo "TUNR_KEY_PASSWORD=${KEY_PW:-$KS_PW}" >> $GITHUB_ENV
            echo "Release-sleutel uit de secrets"
          else
            echo "::warning::Geen release-sleutel in de secrets; APK wordt getekend met android/ci-debug.keystore."
            echo "TUNR_KEYSTORE=$GITHUB_WORKSPACE/android/ci-debug.keystore" >> $GITHUB_ENV
            echo "TUNR_KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
            echo "TUNR_KEY_ALIAS=androiddebugkey" >> $GITHUB_ENV
            echo "TUNR_KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Build (release-APK + AAB voor Google Play)
        env:
          TUNR_CARTO_KEY: ${{ secrets.CARTO_KEY }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Foutenoverzicht
        if: failure()
        run: |
          grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log | head -200 || true

      # Rapport op de branch ci-logs-android (latest.txt), zodat fouten ook buiten GitHub te lezen zijn
      - name: Build-rapport op branch ci-logs-android
        if: always() && github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/rep"
          { echo "commit: $GITHUB_SHA"; echo "status: ${{ job.status }}"; echo
            grep -E "^e: |^w: .*(deprecated|unused).{0,0}|error:|FAILURE|What went wrong" -A3 build.log 2>/dev/null | grep -v "^w: " | head -300 || true
          } > "$RUNNER_TEMP/rep/latest.txt"
          cd "$RUNNER_TEMP/rep" && git init -q && git checkout -q -b ci-logs-android && git add latest.txt
          git -c user.name=github-actions -c user.email=actions@github.com commit -q -m "android $GITHUB_SHA [skip ci]"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-logs-android

      # beheer_upload.sh werkt het manifest bij; dezelfde build wordt vervangen, dus gewoon elke keer uploaden.
      - name: APK en AAB naar beheer.tunr.online (Downloads)
        if: github.event_name != 'pull_request'
        working-directory: .
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.BEHEER_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.BEHEER_FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ] || [ -z "$FTP_SERVER" ]; then
            echo "::warning::Secrets BEHEER_FTP_USERNAME/BEHEER_FTP_PASSWORD (of FTP_SERVER) ontbreken: APK niet naar beheer.tunr.online geüpload."
            exit 0
          fi
          V=$(grep -m1 '^TUNR_VERSION=' android/gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          B=$(grep -m1 '^TUNR_BUILD=' android/gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          SRC=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          APK="$RUNNER_TEMP/Tunr-$V-build$B.apk"
          cp "$SRC" "$APK"; ls -lh "$APK"
          awk -v b="Build $B" '/^## /{f=($0 ~ ("^## " b "( |$)"))?1:0; next} f' CHANGELOG.md 2>/dev/null | head -60 > "$RUNNER_TEMP/notes.md" || true
          [ -s "$RUNNER_TEMP/notes.md" ] || echo "Tunr voor Android, Android TV en Android Auto — versie $V, build $B." > "$RUNNER_TEMP/notes.md"
          # upload-script uit tunr-beheer (openbaar, anoniem op te halen); ftps.sh alleen als het er is
          TOOLS="$RUNNER_TEMP/beheer-tools"; rm -rf "$TOOLS"; mkdir -p "$TOOLS"
          RAW="https://raw.githubusercontent.com/LRvdLinden/tunr-beheer/main/tools"
          curl -fsSL --retry 3 "$RAW/beheer_upload.sh" -o "$TOOLS/beheer_upload.sh"
          curl -fsSL --retry 3 "$RAW/ftps.sh" -o "$TOOLS/ftps.sh" || { echo "geen tools/ftps.sh in tunr-beheer (niet nodig)"; rm -f "$TOOLS/ftps.sh"; }
          chmod +x "$TOOLS"/*.sh
          bash "$TOOLS/beheer_upload.sh" android "$APK" "$V" "$B" "$RUNNER_TEMP/notes.md"
          echo "- APK build $B → beheer.tunr.online (Downloads)" >> $GITHUB_STEP_SUMMARY
          # Android App Bundle voor de Google Play Console (Play maakt zelf de APK's per toestel) → onderdeel "Google Play"
          SRC_AAB=$(ls android/app/build/outputs/bundle/release/*.aab | head -1)
          AAB="$RUNNER_TEMP/Tunr-$V-build$B.aab"
          cp "$SRC_AAB" "$AAB"; ls -lh "$AAB"
          bash "$TOOLS/beheer_upload.sh" play "$AAB" "$V" "$B" "$RUNNER_TEMP/notes.md"
          echo "- AAB build $B → beheer.tunr.online (Downloads, Google Play)" >> $GITHUB_STEP_SUMMARY
