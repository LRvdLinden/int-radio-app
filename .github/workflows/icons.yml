name: Icons

# Mooie zendericonen, uit twee bronnen die naast elkaar draaien (docs/SPEC.md §1):
# - appstore: per populaire zender het app-icoon uit de App Store (tools/make_station_icons.py, iTunes Search API
#   zonder sleutel, ≈ 20 verzoeken per minuut; elke run gaat verder waar de vorige stopte, cache cache.json);
# - site-icons: (tools/make_site_icons.py + tools/store_icons.py, ≤ 60 minuten, budget verdeeld) het app-icoon
#   van de eigen website van de zender (manifest / apple-touch-icon; cache site-cache.json), de store-links op die
#   website (smart app banner / App Store- en Play-links → exact App Store-icoon via iTunes lookup of Google
#   Play-icoon) en, met invoer play = true, de Google Play-zoekfunctie voor populaire zenders zonder store-icoon
#   (cache play-cache.json).
# De caches staan op de branch icons-data. De job publish voegt de tabellen samen (tools/merge_icon_tables.py:
# App Store > Google Play > website, er verdwijnt nooit iets), zet website/assets/data/icons/<CC>.json op main en
# start de workflow Website, zodat tunr.online de nieuwe tabellen serveert.
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Welke bron (all = beide; site = alleen de snelle website-iconen)"
        type: choice
        options: [all, appstore, site]
        default: all
      budget:
        description: "Tijdsbudget voor iTunes-verzoeken (minuten)"
        default: "330"
      site_budget:
        description: "Tijdsbudget job site-icons in minuten (websites + store-links + Play-zoeken, max. 320)"
        default: "300"
      play:
        description: "Google Play-zoekfunctie gebruiken (job site-icons)"
        type: boolean
        default: true
      offline:
        description: "Geen verzoeken, alleen de uitvoer opnieuw maken uit de caches"
        type: boolean
        default: false
  schedule:
    # eerst dagelijks (tot alle zenders van alle landen een keer zijn bekeken), daarna kan dit terug naar wekelijks
    - cron: '23 2 * * *'

permissions:
  contents: write
  actions: write

# per bron een eigen groep, zodat "site" ook kan draaien terwijl een lange App Store-run bezig is;
# publish en icons_data_save.sh voegen samen, dus gelijktijdige runs overschrijven elkaar niet
concurrency:
  group: icons-${{ inputs.source || 'all' }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Pillow installeren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil
      - name: Tests (offline)
        run: |
          python3 -m py_compile tools/make_station_icons.py tools/make_site_icons.py tools/merge_icon_tables.py \
            tools/store_icons.py tools/test_station_icons.py tools/test_site_icons.py tools/test_store_icons.py \
            tools/make_wall.py
          bash -n tools/icons_data_save.sh
          python3 tools/test_station_icons.py
          python3 tools/test_site_icons.py
          python3 tools/test_store_icons.py

  appstore:
    needs: tests
    if: ${{ (inputs.source || 'all') != 'site' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      data: ${{ steps.up.outputs.data }}
    steps:
      - uses: actions/checkout@v5

      - name: Cache ophalen (branch icons-data)
        run: |
          mkdir -p "$RUNNER_TEMP/icons/out/icons"
          if git fetch -q --depth 1 origin icons-data 2>/dev/null && git show FETCH_HEAD:cache.json > "$RUNNER_TEMP/icons/out/cache.json" 2>/dev/null; then
            echo "cache: $(wc -c < "$RUNNER_TEMP/icons/out/cache.json") bytes"
          else
            echo '{"v":1,"items":{}}' > "$RUNNER_TEMP/icons/out/cache.json"
            echo "nog geen cache: begin bij nul"
          fi

      - name: App-iconen zoeken
        timeout-minutes: 340
        run: |
          B="${{ inputs.budget }}"; [ -n "$B" ] || B=330
          python3 tools/make_station_icons.py --cache "$RUNNER_TEMP/icons/out/cache.json" --budget-min "$B" \
            --all --out "$RUNNER_TEMP/icons/out/icons" ${{ inputs.offline && '--offline' || '' }}

      # cache altijd meteen bewaren (ook als de stap hierboven stopte), zodat de volgende run verdergaat
      - name: Cache bewaren (branch icons-data)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/icons_data_save.sh "icons cache (App Store) $GITHUB_RUN_ID" cache.json="$RUNNER_TEMP/icons/out/cache.json"

      - name: Uitvoer doorgeven aan publish
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icons-appstore
          path: ${{ runner.temp }}/icons/out
          retention-days: 1
          if-no-files-found: ignore

      - id: up
        if: always()
        run: '[ -n "$(ls -A "$RUNNER_TEMP/icons/out/icons" 2>/dev/null)" ] && echo "data=1" >> "$GITHUB_OUTPUT" || true'

  site-icons:
    needs: tests
    if: ${{ (inputs.source || 'all') != 'appstore' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      data: ${{ steps.up.outputs.data }}
    steps:
      - uses: actions/checkout@v5

      - name: Pillow installeren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil

      - name: Cache ophalen (branch icons-data)
        run: |
          mkdir -p "$RUNNER_TEMP/icons/out/icons"
          git fetch -q --depth 1 origin icons-data 2>/dev/null || true
          for f in site-cache.json play-cache.json; do
            if git show FETCH_HEAD:$f > "$RUNNER_TEMP/icons/out/$f" 2>/dev/null; then
              echo "$f: $(wc -c < "$RUNNER_TEMP/icons/out/$f") bytes"
            else
              echo '{"v":1,"items":{}}' > "$RUNNER_TEMP/icons/out/$f"
              echo "nog geen $f: begin bij nul"
            fi
          done

      # websites, dan store-links (iTunes lookup ≥ 3 s, Play-pagina's ≥ 2 s), dan Play-zoeken (≥ 2 s); het budget
      # wordt in het script verdeeld (55/18/27 %, zonder Play 75/25 %)
      - name: Website- en store-iconen zoeken
        timeout-minutes: 330
        env:
          PLAY: ${{ (github.event_name == 'workflow_dispatch' && !inputs.play) && 'false' || 'true' }}
        run: |
          B="${{ inputs.site_budget }}"; [ -n "$B" ] || B=300
          [ "${B%.*}" -le 320 ] 2>/dev/null || B=320
          python3 tools/make_site_icons.py --cache "$RUNNER_TEMP/icons/out/site-cache.json" \
            --play-cache "$RUNNER_TEMP/icons/out/play-cache.json" --play "$PLAY" --budget-min "$B" \
            --all --store-max 3000 --play-max 1500 --play-per-country 100000 --play-world 100000 \
            --out "$RUNNER_TEMP/icons/out/icons" ${{ inputs.offline && '--offline' || '' }}

      - name: Caches bewaren (branch icons-data)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/icons_data_save.sh "icons cache (websites + stores) $GITHUB_RUN_ID" \
            site-cache.json="$RUNNER_TEMP/icons/out/site-cache.json" \
            play-cache.json="$RUNNER_TEMP/icons/out/play-cache.json"

      - name: Uitvoer doorgeven aan publish
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icons-site
          path: ${{ runner.temp }}/icons/out
          retention-days: 1
          if-no-files-found: ignore

      - id: up
        if: always()
        run: '[ -n "$(ls -A "$RUNNER_TEMP/icons/out/icons" 2>/dev/null)" ] && echo "data=1" >> "$GITHUB_OUTPUT" || true'

  publish:
    needs: [appstore, site-icons]
    if: ${{ always() && (needs.appstore.outputs.data == '1' || needs.site-icons.outputs.data == '1') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Uitvoer van de bronnen ophalen
        uses: actions/download-artifact@v4
        with:
          pattern: icons-*
          path: ${{ runner.temp }}/icons/in

      - name: Caches bewaren (branch icons-data)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/icons_data_save.sh "icons caches $GITHUB_RUN_ID" \
            cache.json="$RUNNER_TEMP/icons/in/icons-appstore/cache.json" \
            site-cache.json="$RUNNER_TEMP/icons/in/icons-site/site-cache.json" \
            play-cache.json="$RUNNER_TEMP/icons/in/icons-site/play-cache.json"

      # altijd vanaf de nieuwste main samenvoegen (ook een andere run kan net tabellen gecommit hebben);
      # merge_icon_tables.py verwijdert nooit iets uit de bestaande tabellen
      - name: Tabellen samenvoegen en in de repo zetten
        id: commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          BR="${GITHUB_REF_NAME}"
          for i in 1 2 3 4 5; do
            git fetch -q origin "$BR" && git reset -q --hard "origin/$BR"
            python3 tools/merge_icon_tables.py tables --existing website/assets/data/icons \
              --appstore "$RUNNER_TEMP/icons/in/icons-appstore/icons" --site "$RUNNER_TEMP/icons/in/icons-site/icons" \
              --out website/assets/data/icons --sources "$RUNNER_TEMP/icons/sources.json"
            git add -A website/assets/data/icons
            if git diff --cached --quiet; then echo "iconen ongewijzigd"; exit 0; fi
            echo "files: $(ls website/assets/data/icons | wc -l), $(du -sh website/assets/data/icons | cut -f1)"
            git commit -qm "Zendericonen bijgewerkt (App Store + Google Play + websites, tools/merge_icon_tables.py) [skip ci]"
            if git push -q origin "HEAD:$BR"; then echo "changed=1" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "main veranderde tussendoor: opnieuw ($i)"
            sleep $((i * 10))
          done
          echo "::error::Iconen niet gepusht"; exit 1

      # per sleutel de gekozen bron (alleen voor debuggen, niet in de openbare tabellen)
      - name: Bronnen bewaren (branch icons-data)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/icons_data_save.sh "icons sources $GITHUB_RUN_ID" sources.json="$RUNNER_TEMP/icons/sources.json"

      - name: Website opnieuw uploaden
        if: steps.commit.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/actions/workflows/website.yml/dispatches" -f ref=main
