name: Website

# Zet website/ via FTPS op de webserver, bij elke push naar main die website/ raakt, of met de hand.
# Opzet zoals bingr-website (deploy.yml): alleen FTPS met een geverifieerd certificaat, doelmap automatisch,
# beveiligingsheaders + http → https via .htaccess, en daarna controleren of de site live de nieuwe build toont.
#
# Benodigde repository-secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# Optioneel: FTP_USERNAME_ALT (tweede gebruikersnaam) en FTP_DIR (doelmap, anders automatisch).
# Het domein staat op één plek: website/assets/js/brand.js (window.TUNR.domain).
#
# Presskit (footer-link "PressKit"): bij elke run maakt tools/make_presskit.py website/presskit/Tunr-PressKit.zip +
# presskit.json uit de App Store-afbeeldingen in de openbare repo tunr-beheer (map appstore/, sparse clone). Niet in
# git; alleen uploaden als versie of grootte anders is dan online. Clone mislukt? Dan blijft wat op de server staat.
# Met de hand: invoer presskit_only = alleen de presskit opnieuw maken en uploaden (snel, rest van de site blijft).

on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/website.yml']
  workflow_dispatch:
    inputs:
      refresh_wall:
        description: "Hero-logo's vernieuwen (opnieuw uit Radio Browser halen)"
        type: boolean
        default: false
      presskit_only:
        description: "Alleen de presskit opnieuw maken en uploaden (rest van de site niet)"
        type: boolean
        default: false
  # elke maand opnieuw uploaden, zodat het Apple Maps-token (geldig 180 dagen) altijd vers is (en de presskit bijwerken)
  schedule:
    - cron: '17 4 1 * *'

permissions:
  contents: write

concurrency:
  group: website-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5

      - name: lftp en Pillow installeren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp python3-pil

      # Vaste zenderlogo's voor de hero: alleen maken als ze er nog niet zijn (of op verzoek), dan in de repo zetten.
      # Zo staan ze vast en laadt de site alleen eigen bestanden (geen live ophalen, geen geflikker).
      - name: Hero-logo's (vast)
        if: github.event_name != 'pull_request' && inputs.presskit_only != true
        working-directory: .
        run: |
          if [ -f website/assets/js/wall.js ] && [ "${{ inputs.refresh_wall }}" != "true" ]; then
            echo "Hero-logo's staan er al ($(ls website/assets/img/wall | wc -l) stuks)"; exit 0
          fi
          python3 tools/make_wall.py || { echo "::warning::Hero-logo's niet gemaakt (Radio Browser onbereikbaar?)"; exit 0; }
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add website/assets/js/wall.js website/assets/img/wall
          git diff --cached --quiet && exit 0
          git commit -qm "Hero: vaste zenderlogo's (tools/make_wall.py) [skip ci]"
          for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep 5; done
          echo "::warning::Hero-logo's niet gepusht (wel geüpload)"

      # De homepage laadt de screenshots als WebP (<picture> met JPG als terugval); hier opnieuw gemaakt zodat ze kloppen.
      - name: WebP van de screenshots maken
        if: inputs.presskit_only != true
        run: |
          python3 - <<'PY'
          import glob
          from PIL import Image
          n = 0
          for f in sorted(glob.glob("assets/img/nl/*.jpg") + glob.glob("assets/img/en/*.jpg")):
              Image.open(f).save(f[:-4] + ".webp", "WEBP", quality=80, method=6)
              n += 1
          print(f"{n} WebP-bestanden gemaakt")
          PY

      # Apple Maps in de webspeler (MapKit JS): token (JWT, ES256) uit de .p8-sleutel in het secret MAPKIT_P8.
      # Het token werkt alleen vanaf https://tunr.online (origin-claim) en is 180 dagen geldig; het staat alleen op de
      # server (assets/js/mapkit-token.js, niet in git). Zonder secret valt de kaart terug op Leaflet.
      - name: Apple Maps-token maken
        if: inputs.presskit_only != true
        env:
          MAPKIT_P8: ${{ secrets.MAPKIT_P8 }}
          MAPKIT_KEY_ID: STP7XLVDL5
          APPLE_TEAM_ID: EU3UY476T6
        run: |
          if [ -z "${MAPKIT_P8:-}" ]; then echo "::warning::Secret MAPKIT_P8 ontbreekt: de kaart gebruikt Leaflet."; rm -f assets/js/mapkit-token.js; exit 0; fi
          pip install --quiet --disable-pip-version-check "pyjwt[crypto]==2.9.0"
          python3 - <<'PY'
          import os, time, jwt, re
          key = os.environ["MAPKIT_P8"].strip()
          if "BEGIN PRIVATE KEY" not in key:   # alleen de base64-inhoud geplakt
              key = "-----BEGIN PRIVATE KEY-----\n" + re.sub(r"\s+", "", key) + "\n-----END PRIVATE KEY-----\n"
          dom = re.search(r"domain:\s*'(https?://[^']+)'", open("assets/js/brand.js").read()).group(1).rstrip("/")
          now = int(time.time())
          tok = jwt.encode({"iss": os.environ["APPLE_TEAM_ID"], "iat": now, "exp": now + 180 * 86400, "origin": dom},
                           key, algorithm="ES256", headers={"kid": os.environ["MAPKIT_KEY_ID"], "typ": "JWT"})
          open("assets/js/mapkit-token.js", "w").write(
              "// Gemaakt door de workflow Website; alleen geldig op " + dom + ". Niet in git.\n"
              "window.TUNR_MAPKIT_TOKEN = " + repr(tok).replace("'", '"') + ";\n")
          print("Apple Maps-token gemaakt voor", dom)
          PY

      # Landingspagina's voor zoekmachines (/radio/, /radio/<land>/, /radio/<land>/<zender>/) + sitemap.xml en het blok
      # "Populaire zenders" op de homepage. Niet in git (website/radio/ staat in .gitignore): elke upload vers uit
      # Radio Browser. Onbereikbaar? Dan de laatste momentopname uit de cache; zonder cache gewoon zonder deze pagina's.
      - name: Momentopname zenders (cache)
        if: inputs.presskit_only != true
        uses: actions/cache@v4
        with:
          path: .seo-cache.json
          key: seo-stations-${{ github.run_id }}
          restore-keys: seo-stations-

      - name: Landingspagina's per land en zender maken
        if: inputs.presskit_only != true
        working-directory: .
        run: |
          python3 tools/make_seo_pages.py || echo "::warning::Landingspagina's niet gemaakt; de site wordt zonder nieuwe /radio/-pagina's geüpload"
          python3 tools/check_seo.py website || echo "::warning::SEO-controle vond problemen (zie hierboven)"

      - name: Domein bepalen
        id: dom
        run: |
          D=$(grep -oE "domain:\s*'https?://[^']+'" assets/js/brand.js | sed -E "s/.*'https?:\/\/([^'/]+).*/\1/" | head -1)
          echo "domain=${D}" >> "$GITHUB_OUTPUT"
          echo "::notice::Domein uit brand.js: ${D:-onbekend}"

      # Presskit uit tunr-beheer/appstore (openbaar, zonder token). De online presskit.json gaat mee als --previous:
      # gelijke inhoud = zelfde versie en datum (dan geen upload). Mislukt iets, dan geen presskit in deze run en
      # blijven de bestanden op de server staan (de mirror sluit presskit/ uit en verwijdert niets).
      - name: Presskit maken
        id: presskit
        working-directory: .
        env:
          DOMAIN: ${{ steps.dom.outputs.domain }}
        run: |
          rm -rf website/presskit /tmp/tb /tmp/presskit-prev.json
          if [ -n "${DOMAIN:-}" ]; then
            curl -fsSL --max-time 20 "https://$DOMAIN/presskit/presskit.json" -o /tmp/presskit-prev.json 2>/dev/null || rm -f /tmp/presskit-prev.json
          fi
          if ! { git clone -q --depth 1 --filter=blob:none --sparse https://github.com/LRvdLinden/tunr-beheer /tmp/tb \
                 && git -C /tmp/tb sparse-checkout set appstore; }; then
            echo "::warning::tunr-beheer/appstore niet opgehaald: presskit niet bijgewerkt (de versie online blijft staan)"; exit 0
          fi
          prev=(); [ -s /tmp/presskit-prev.json ] && prev=(--previous /tmp/presskit-prev.json)
          if ! python3 tools/make_presskit.py --appstore /tmp/tb/appstore --out website/presskit "${prev[@]}"; then
            rm -rf website/presskit
            echo "::warning::Presskit niet gemaakt (zie hierboven); de versie online blijft staan"; exit 0
          fi
          new=$(python3 -c 'import json; d=json.load(open("website/presskit/presskit.json")); print(d["version"], d["size"])')
          old=$(python3 -c 'import json; d=json.load(open("/tmp/presskit-prev.json")); print(d.get("version",""), d.get("size",""))' 2>/dev/null || true)
          if [ "$new" = "$old" ]; then
            echo "::notice::Presskit ongewijzigd (${new% *}): geen upload"; echo "changed=0" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Presskit ${new% *} ($(( ${new#* } / 1048576 )) MB) wordt geüpload (online: ${old% *})"; echo "changed=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Uploaden via FTPS
        id: upload
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_USERNAME_ALT: ${{ secrets.FTP_USERNAME_ALT }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
          DOMAIN: ${{ steps.dom.outputs.domain }}
          PRESSKIT_ONLY: ${{ inputs.presskit_only == true && '1' || '' }}
          PRESSKIT_CHANGED: ${{ steps.presskit.outputs.changed }}
        run: |
          set -euo pipefail
          if [ -z "${FTP_SERVER:-}" ] || [ -z "${FTP_PASSWORD:-}" ]; then
            echo "::warning::FTP-secrets ontbreken (FTP_SERVER, FTP_USERNAME, FTP_PASSWORD) — website niet geüpload."
            echo "skipped=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          trim(){ printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          FTP_SERVER=$(trim "$FTP_SERVER" | sed -E 's#^[a-zA-Z]+://##; s#/.*$##; s#:[0-9]+$##')
          FTP_USERNAME=$(trim "${FTP_USERNAME:-}"); FTP_USERNAME_ALT=$(trim "${FTP_USERNAME_ALT:-}")
          export LFTP_PASSWORD="$(trim "$FTP_PASSWORD")"
          common="set cmd:fail-exit true; set net:max-retries 3; set net:timeout 30; set net:reconnect-interval-base 5; set ftp:passive-mode true; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate yes; set ssl:check-hostname yes; set ssl:ca-file /tmp/ftp-ca.pem"
          CA=/tmp/ftp-ca.pem; cp /etc/ssl/certs/ca-certificates.crt "$CA"
          ip_of(){ (getent ahostsv4 "$1" || true) | awk 'NR==1{print $1}'; }
          # onvolledige certificaatketen: tussencertificaat via het AIA-adres ophalen (controle blijft tegen een vertrouwde root)
          add_chain(){
            local h="$1" aia
            aia=$(timeout 30 openssl s_client -connect "$h:21" -starttls ftp -servername "$h" </dev/null 2>/dev/null \
              | openssl x509 -noout -text 2>/dev/null | grep -oE 'CA Issuers - URI:[^ ]+' | sed 's/CA Issuers - URI://' | head -1 || true)
            [ -n "$aia" ] || return 0
            curl -fsSL --max-time 20 "$aia" -o /tmp/inter.bin 2>/dev/null || return 0
            openssl x509 -inform DER -in /tmp/inter.bin -out /tmp/inter.pem 2>/dev/null || openssl x509 -in /tmp/inter.bin -out /tmp/inter.pem 2>/dev/null || return 0
            grep -q "$(sed -n 2p /tmp/inter.pem)" "$CA" || cat /tmp/inter.pem >> "$CA"
          }
          vcode(){ timeout 40 openssl s_client -connect "$1:21" -starttls ftp -servername "$1" -verify_hostname "$1" -CAfile "$CA" </dev/null 2>/dev/null | grep -m1 'Verify return code' | sed 's/.*Verify return code: //' || true; }
          cert_ok(){ timeout 40 openssl s_client -connect "$1:21" -starttls ftp -servername "$1" -verify_hostname "$1" -verify_return_error -CAfile "$CA" </dev/null 2>/dev/null | grep -q 'Verify return code: 0 (ok)'; }
          # host met een geldig certificaat: FTP_SERVER, ftp.<domein>, <domein>, of een naam uit het certificaat (zelfde IP)
          HOST=""
          for attempt in 1 2 3; do
            [ "$attempt" -gt 1 ] && { echo "Certificaatcontrole opnieuw over 30 s…"; sleep 30; }
            for base in "$FTP_SERVER" ${DOMAIN:+ftp.$DOMAIN} ${DOMAIN:+$DOMAIN}; do
              base_ip=$(ip_of "$base"); [ -n "$base_ip" ] || continue
              [ "$attempt" = 1 ] && add_chain "$base"
              if cert_ok "$base"; then HOST="$base"; break 2; fi
              names=$(timeout 40 openssl s_client -connect "$base:21" -starttls ftp -servername "$base" </dev/null 2>/dev/null \
                | openssl x509 -noout -ext subjectAltName -subject 2>/dev/null \
                | grep -oE '(DNS:|CN ?= ?)(\*\.)?[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+' | sed -E 's/^(DNS:|CN ?= ?)//' | sort -u || true)
              ptr=$(getent hosts "$base_ip" 2>/dev/null | awk '{print $2}' | sed 's/\.$//' || true)
              [ "$attempt" = 1 ] && echo "::notice::FTPS ${base} (${base_ip}): controle '$(vcode "$base")' · certificaat: $(echo $names | tr '\n' ' ') · servernaam: ${ptr:-onbekend}"
              cands="$ptr"; first="${base%%.*}"
              for n in $names; do case "$n" in \*.*) cands="$cands $first.${n#\*.} ftp.${n#\*.}";; *) cands="$cands $n";; esac; done
              for n in $(echo $cands | tr ' ' '\n' | sort -u); do
                [ "$(ip_of "$n")" = "$base_ip" ] || { [ "$attempt" = 1 ] && echo "::notice::${n}: ander IP-adres, overgeslagen"; continue; }
                if cert_ok "$n"; then HOST="$n"; break 3; fi
                [ "$attempt" = 1 ] && echo "::notice::${n}: controle '$(vcode "$n")'"
              done
            done
          done
          [ -n "$HOST" ] || { echo "::error::Geen FTP-server met een geldig FTPS-certificaat gevonden. Zet FTP_SERVER op de hostnaam uit het certificaat van de hoster."; exit 1; }
          USER_OK=""
          for attempt in 1 2 3 4; do
            [ "$attempt" -gt 1 ] && { echo "Nieuwe poging $attempt over 45 s…"; sleep 45; }
            for u in "$FTP_USERNAME" "${FTP_USERNAME_ALT:-}"; do
              [ -z "$u" ] && continue
              if lftp -e "$common; open --env-password -u \"$u\" \"$HOST\"; cls -1 > /tmp/root.txt; bye" 2>/tmp/err.txt; then USER_OK="$u"; break 2; fi
              msg=$(grep -viE 'user|pass' /tmp/err.txt | tr '\n' ' ' | tail -c 200 || true)
              echo "::warning::Inloggen mislukt (poging $attempt): ${msg:-geen melding}"
            done
          done
          [ -n "$USER_OK" ] || { echo "::error::Inloggen op de FTP-server mislukt."; exit 1; }
          echo "::notice::Ingelogd via FTPS op ${HOST} (certificaat geverifieerd)"
          # doelmap: FTP_DIR, anders de map waar index.html al staat of de gebruikelijke webmappen
          TARGET="${FTP_DIR:-}"
          if [ -z "$TARGET" ] && grep -qx "/\?index.html" /tmp/root.txt; then TARGET="."; fi
          if [ -z "$TARGET" ]; then
            for d in public_html httpdocs www htdocs ${DOMAIN:+domains/$DOMAIN/public_html}; do
              top="${d%%/*}"
              if grep -qx "/\?$top/\?" /tmp/root.txt; then
                if [ "$d" = "$top" ] || lftp -e "$common; open --env-password -u \"$USER_OK\" \"$HOST\"; cls -1 $d/ ; bye" >/dev/null 2>&1; then TARGET="$d"; break; fi
              fi
            done
          fi
          TARGET="${TARGET:-.}"
          echo "::notice::Doelmap: $([ -n "${FTP_DIR:-}" ] && echo 'FTP_DIR' || echo 'automatisch bepaald')"
          # presskit/ (gegenereerd, groot): alleen bij een nieuwe versie, zip eerst (als .part, daarna hernoemd), json als laatste
          if [ "${PRESSKIT_CHANGED:-}" = 1 ] && [ -f presskit/Tunr-PressKit.zip ] && [ -f presskit/presskit.json ]; then
            lftp -e "$common; open --env-password -u \"$USER_OK\" \"$HOST\"; mkdir -p -f \"$TARGET/presskit\"; put presskit/Tunr-PressKit.zip -o \"$TARGET/presskit/Tunr-PressKit.zip.part\"; set cmd:fail-exit false; rm \"$TARGET/presskit/Tunr-PressKit.zip\"; set cmd:fail-exit true; mv \"$TARGET/presskit/Tunr-PressKit.zip.part\" \"$TARGET/presskit/Tunr-PressKit.zip\"; put presskit/presskit.json -o \"$TARGET/presskit/presskit.json\"; bye"
            echo "::notice::Presskit geüpload ($(python3 -c 'import json; print(json.load(open("presskit/presskit.json"))["version"])'))"
          fi
          if [ -n "${PRESSKIT_ONLY:-}" ]; then echo "::notice::Alleen de presskit (presskit_only): rest van de site niet geüpload"; exit 0; fi
          lftp -e "$common; open --env-password -u \"$USER_OK\" \"$HOST\"; mirror -R --verbose --parallel=4 --only-newer --exclude-glob .DS_Store --exclude-glob README.md --exclude '^radio/' --exclude '^presskit/' ./ \"$TARGET\"; bye"
          # /radio/ is helemaal gegenereerd (elke run nieuwe bestandsdatums): alleen bestanden met een andere grootte
          # uploaden, en pagina's van zenders die uit de top vallen weghalen
          if [ -f radio/index.html ]; then
            lftp -e "$common; open --env-password -u \"$USER_OK\" \"$HOST\"; mirror -R --parallel=8 --ignore-time --delete --exclude-glob .DS_Store ./radio \"$TARGET/radio\"; bye"
            echo "::notice::Landingspagina's geüpload ($(find radio -name index.html | wc -l) pagina's)"
          fi
          # .htaccess: alleen het blok tussen de markeringen (opnieuw) zetten; inhoud van de hoster blijft staan
          lftp -e "$common; open --env-password -u \"$USER_OK\" \"$HOST\"; cls -1 -a \"$TARGET/\"; bye" > /tmp/ls-all.txt 2>/dev/null || true
          rm -f /tmp/htaccess.txt; ht_ok=1
          if grep -qE '(^|/)\.htaccess$' /tmp/ls-all.txt; then
            lftp -e "$common; open --env-password -u \"$USER_OK\" \"$HOST\"; get \"$TARGET/.htaccess\" -o /tmp/htaccess.txt; bye" >/dev/null 2>&1 || ht_ok=0
          else : > /tmp/htaccess.txt; fi
          if [ "$ht_ok" = 1 ]; then
            python3 - <<'PY'
          import re, os
          p = "/tmp/htaccess.txt"
          dom = re.escape(os.environ.get("DOMAIN") or "")
          s = open(p, encoding="utf-8", errors="surrogateescape").read()
          s = re.sub(r"\n?# BEGIN tunr-security.*?# END tunr-security\n?", "\n", s, flags=re.S).strip("\n")
          redirect = ("<IfModule mod_rewrite.c>\nRewriteEngine On\nRewriteCond %{HTTPS} !=on\nRewriteCond %{HTTP:X-Forwarded-Proto} !=https\n"
                      + (f"RewriteCond %{{HTTP_HOST}} ^(www\\.)?{dom}$ [NC]\n" if dom else "")
                      + "RewriteCond %{THE_REQUEST} ^[A-Z]+\\s(/[^\\s?]*)\nRewriteRule ^ https://%{HTTP_HOST}%1 [R=301,L,NE]\n</IfModule>\n")
          headers = ("<IfModule mod_headers.c>\n"
                     "Header always set Strict-Transport-Security \"max-age=31536000\"\n"
                     "Header always set X-Content-Type-Options \"nosniff\"\n"
                     "Header always set Referrer-Policy \"strict-origin-when-cross-origin\"\n"
                     "Header always set Permissions-Policy \"camera=(), microphone=(), geolocation=()\"\n"
                     "Header always set X-Frame-Options \"DENY\"\n"
                     "Header always set Content-Security-Policy \"frame-ancestors 'none'; base-uri 'self'; object-src 'none'\"\n"
                     # presskit: zip altijd als download, presskit.json altijd vers (de functie presskit leest de versie)
                     "<FilesMatch \"\\.zip$\">\nHeader set Content-Disposition \"attachment\"\n</FilesMatch>\n"
                     "<FilesMatch \"^presskit\\.json$\">\nHeader set Cache-Control \"no-cache\"\n</FilesMatch>\n"
                     "</IfModule>\n")
          # gzip voor tekst (html, css, js, json, svg, xml) en cache: afbeeldingen/audio 30 dagen, css/js 7 dagen
          # (pagina's verwijzen met ?v=), json 1 dag, html altijd opnieuw controleren
          deflate = ("<IfModule mod_deflate.c>\n<IfModule mod_filter.c>\n"
                     "AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml application/xml application/xhtml+xml "
                     "application/javascript text/javascript application/json application/ld+json application/manifest+json image/svg+xml\n"
                     "</IfModule>\n</IfModule>\n")
          expires = ("<IfModule mod_expires.c>\nExpiresActive On\n"
                     + "".join(f'ExpiresByType {t} "access plus {d}"\n' for t, d in [
                         ("text/html", "0 seconds"), ("image/png", "30 days"), ("image/jpeg", "30 days"), ("image/webp", "30 days"),
                         ("image/svg+xml", "30 days"), ("image/x-icon", "30 days"), ("audio/mpeg", "30 days"), ("audio/mp4", "30 days"),
                         ("text/css", "7 days"), ("application/javascript", "7 days"), ("text/javascript", "7 days"),
                         ("application/json", "1 day"), ("application/xml", "1 day"), ("text/xml", "1 day")])
                     + "</IfModule>\n")
          def block(with_redirect):
              return ("# BEGIN tunr-security (gezet door de workflow Website; niet met de hand wijzigen)\n"
                      + (redirect if with_redirect else "") + headers + deflate + expires + "ErrorDocument 404 /404.html\n# END tunr-security\n")
          rest = ("\n" + s + "\n") if s else ""
          open(p + ".new", "w", encoding="utf-8", errors="surrogateescape").write(block(True) + rest)
          open(p + ".nossl", "w", encoding="utf-8", errors="surrogateescape").write(block(False) + rest)
          PY
            if lftp -e "$common; open --env-password -u \"$USER_OK\" \"$HOST\"; put /tmp/htaccess.txt.new -o \"$TARGET/.htaccess\"; chmod 644 \"$TARGET/.htaccess\"; bye" >/dev/null 2>&1; then
              echo "::notice::.htaccess bijgewerkt (beveiligingsheaders, http → https, gzip, cache, 404-pagina)"
              if [ -n "${DOMAIN:-}" ]; then
                sleep 3
                loc=$(curl -s -o /dev/null --max-time 20 -w '%{http_code} %{redirect_url}' "https://$DOMAIN/" || true)
                case "$loc" in 30[1278]\ https://$DOMAIN/|30[1278]\ https://www.$DOMAIN/)
                  lftp -e "$common; open --env-password -u \"$USER_OK\" \"$HOST\"; put /tmp/htaccess.txt.nossl -o \"$TARGET/.htaccess\"; chmod 644 \"$TARGET/.htaccess\"; bye" >/dev/null 2>&1 || true
                  echo "::warning::https://$DOMAIN/ stuurde naar zichzelf door; .htaccess zonder http → https-regel gezet." ;;
                esac
              fi
            else echo "::warning::.htaccess kon niet worden geüpload"; fi
          fi
          echo "::notice::Website geüpload"

      - name: Controleren of de site online staat
        if: success() && steps.upload.outputs.skipped != '1' && steps.dom.outputs.domain != ''
        env:
          DOMAIN: ${{ steps.dom.outputs.domain }}
          PRESSKIT_ONLY: ${{ inputs.presskit_only == true && '1' || '' }}
        run: |
          sleep 5
          if [ -f presskit/presskit.json ]; then
            want=$(python3 -c 'import json; print(json.load(open("presskit/presskit.json"))["version"])')
            live=$(curl -sL --max-time 20 "https://$DOMAIN/presskit/presskit.json?ts=$(date +%s)" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))' 2>/dev/null || true)
            [ "$live" = "$want" ] && echo "::notice::Presskit online: $live" || echo "::warning::Presskit online is '${live:-niets}', verwacht '$want'"
          fi
          [ -n "${PRESSKIT_ONLY:-}" ] && exit 0
          want=$(grep -o '<span data-build>[^<]*' index.html | sed 's/<span data-build>//' | head -1)
          live=$(curl -sL --max-time 20 "https://$DOMAIN/" | grep -o '<span data-build>[^<]*' | sed 's/<span data-build>//' | head -1 || true)
          if [ -n "$want" ] && [ "$live" != "$want" ]; then
            echo "::error::$DOMAIN toont '${live:-niets}', verwacht '$want': de upload is niet op de juiste plek aangekomen (klopt FTP_DIR en het domein in brand.js?)."; exit 1
          fi
          echo "::notice::https://$DOMAIN/ is live (${live:-zonder buildnummer})"
          curl -s -o /dev/null -D /tmp/h.txt --max-time 20 "https://$DOMAIN/" || true
          for h in 'strict-transport-security' 'x-content-type-options: nosniff' 'x-frame-options: deny'; do
            tr -d '\r' < /tmp/h.txt | grep -qiF "$h" || echo "::warning::Header ontbreekt op https://$DOMAIN/: $h"
          done
