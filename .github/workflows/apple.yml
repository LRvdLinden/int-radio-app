name: Apple

# Eén multiplatform-target Tunr (iPhone, iPad, Mac, Apple TV; CarPlay zit in de iOS-build).
# 1. maakt apple/Tunr.xcodeproj opnieuw uit apple/project.yml (XcodeGen) en commit hem, zodat klonen + openen werkt;
# 2. controle-build per platform zonder ondertekening;
# 3. als alles slaagt: het complete Xcode-project als zip in versions/apple/<versie>/build-<N>/ (zie CLAUDE.md).
on:
  push:
    branches: [main]
    paths: ['apple/**', '.github/workflows/apple.yml']
  pull_request:
    paths: ['apple/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apple
    steps:
      - uses: actions/checkout@v4

      - name: Xcode kiezen
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Project genereren (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen --version
          xcodegen generate

      - name: Xcode-project in de repo bijwerken
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A Tunr.xcodeproj
          if git diff --cached --quiet; then echo "Xcode-project ongewijzigd"; exit 0; fi
          git commit -m "Xcode-project bijgewerkt (XcodeGen) [skip ci]"
          for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep 5; done
          echo "::warning::Xcode-project niet gepusht"

      - name: Packages ophalen
        run: xcodebuild -resolvePackageDependencies -project Tunr.xcodeproj -scheme Tunr || true

      - name: Build iOS + iPadOS + CarPlay (simulator)
        id: ios
        continue-on-error: true
        run: |
          set +e
          xcodebuild build -project Tunr.xcodeproj -scheme Tunr \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO > ios.log 2>&1; rc=$?
          tail -n 30 ios.log; exit $rc

      - name: Build tvOS (simulator)
        id: tvos
        continue-on-error: true
        run: |
          set +e
          xcodebuild build -project Tunr.xcodeproj -scheme Tunr \
            -destination 'generic/platform=tvOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO > tvos.log 2>&1; rc=$?
          tail -n 30 tvos.log; exit $rc

      - name: Build macOS
        id: macos
        continue-on-error: true
        run: |
          set +e
          xcodebuild build -project Tunr.xcodeproj -scheme Tunr \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO > macos.log 2>&1; rc=$?
          tail -n 30 macos.log; exit $rc

      # Complete Xcode-project als zip in de repo: versions/apple/<versie>/build-<N>/ (alleen als alles slaagt en hij nog niet bestaat)
      - name: Xcode-zip in de repo zetten
        if: github.event_name != 'pull_request' && steps.ios.outcome == 'success' && steps.tvos.outcome == 'success' && steps.macos.outcome == 'success'
        working-directory: .
        run: |
          V=$(grep -m1 'MARKETING_VERSION' apple/project.yml | grep -o '[0-9][0-9.]*')
          B=$(grep -m1 'CURRENT_PROJECT_VERSION' apple/project.yml | grep -o '[0-9]\+')
          DIR="versions/apple/$V/build-$B"; ZIP="$DIR/Tunr-$V-build$B-Xcode.zip"
          git pull --rebase -q origin "${GITHUB_REF_NAME}" || true
          if [ -f "$ZIP" ]; then echo "$ZIP bestaat al"; exit 0; fi
          mkdir -p "$DIR"
          rm -f apple/*.log
          zip -qr "$ZIP" apple -x 'apple/build/*' '*/xcuserdata/*' '*.DS_Store'
          ls -lh "$ZIP"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add "$ZIP"
          git commit -m "Xcode-project $V build $B als zip [skip ci]"
          for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep 5; done
          echo "::error::Xcode-zip niet gepusht"; exit 1

      - name: Foutenoverzicht
        if: always()
        run: |
          echo "## Apple-build" >> $GITHUB_STEP_SUMMARY
          echo "- iOS/iPadOS: ${{ steps.ios.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- tvOS: ${{ steps.tvos.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- macOS: ${{ steps.macos.outcome }}" >> $GITHUB_STEP_SUMMARY
          for f in ios tvos macos; do
            echo "=== $f errors ==="
            grep -E "error:" $f.log | sort -u | head -200 || true
          done

      - name: Status
        if: steps.ios.outcome != 'success' || steps.tvos.outcome != 'success' || steps.macos.outcome != 'success'
        run: exit 1
