name: Apple

# Eén multiplatform-target Tunr (iPhone, iPad, Mac, Apple TV; CarPlay zit in de iOS-build).
# 1. maakt apple/Tunr.xcodeproj opnieuw uit apple/project.yml (XcodeGen) en commit hem, zodat klonen + openen werkt;
# 2. controle-build per platform zonder ondertekening;
# 3. als alles slaagt: het complete Xcode-project als zip naar beheer.tunr.online (tab Downloads, zie CLAUDE.md).
#    Nooit op GitHub (geen repo, geen release, geen artefact). Secrets: FTP_SERVER, BEHEER_FTP_USERNAME, BEHEER_FTP_PASSWORD.
on:
  push:
    branches: [main]
    paths: ['apple/**', '.github/workflows/apple.yml']
  pull_request:
    paths: ['apple/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      ok: ${{ steps.ok.outputs.ok }}
    defaults:
      run:
        working-directory: apple
    steps:
      - uses: actions/checkout@v4

      - name: Xcode kiezen
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Project genereren (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen --version
          xcodegen generate

      - name: Xcode-project in de repo bijwerken
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A Tunr.xcodeproj
          if git diff --cached --quiet; then echo "Xcode-project ongewijzigd"; exit 0; fi
          git commit -m "Xcode-project bijgewerkt (XcodeGen) [skip ci]"
          for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep 5; done
          echo "::warning::Xcode-project niet gepusht"

      - name: Beschikbare bestemmingen (iPhone, iPad, Mac, Apple TV)
        run: |
          xcodebuild -showdestinations -project Tunr.xcodeproj -scheme Tunr > destinations.txt 2>&1 || true
          grep -E "platform:" destinations.txt | sed -E 's/, id:[^,]*//' | sort -u | head -40 || true

      - name: Packages ophalen
        run: xcodebuild -resolvePackageDependencies -project Tunr.xcodeproj -scheme Tunr || true

      - name: Build iOS + iPadOS + CarPlay (simulator)
        id: ios
        continue-on-error: true
        run: |
          set +e
          xcodebuild build -project Tunr.xcodeproj -scheme Tunr \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO > ios.log 2>&1; rc=$?
          tail -n 30 ios.log; exit $rc

      - name: Build tvOS (simulator)
        id: tvos
        continue-on-error: true
        run: |
          set +e
          xcodebuild build -project Tunr.xcodeproj -scheme Tunr \
            -destination 'generic/platform=tvOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO > tvos.log 2>&1; rc=$?
          tail -n 30 tvos.log; exit $rc

      - name: Build macOS
        id: macos
        continue-on-error: true
        run: |
          set +e
          xcodebuild build -project Tunr.xcodeproj -scheme Tunr \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO > macos.log 2>&1; rc=$?
          tail -n 30 macos.log; exit $rc

      # Complete Xcode-project als zip naar beheer.tunr.online/builds (alleen als alles slaagt).
      # beheer_upload.sh werkt het manifest bij; dezelfde build wordt vervangen, dus gewoon elke keer uploaden.
      - name: Klaar voor de Xcode-zip?
        id: ok
        if: github.event_name != 'pull_request' && steps.ios.outcome == 'success' && steps.tvos.outcome == 'success' && steps.macos.outcome == 'success'
        run: echo "ok=true" >> "$GITHUB_OUTPUT"

      # Log op de branch ci-logs (latest.txt), zodat fouten en bestemmingen ook buiten GitHub te lezen zijn
      - name: Build-rapport op branch ci-logs
        if: always() && github.event_name != 'pull_request'
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/rep"
          {
            echo "commit: $GITHUB_SHA"
            echo "ios: ${{ steps.ios.outcome }}  tvos: ${{ steps.tvos.outcome }}  macos: ${{ steps.macos.outcome }}"
            echo; echo "=== bestemmingen ==="; cat apple/destinations.txt 2>/dev/null | head -80
            for f in ios tvos macos; do echo; echo "=== $f errors ==="; grep -E "error:" apple/$f.log 2>/dev/null | sort -u | head -150; done
          } > "$RUNNER_TEMP/rep/latest.txt"
          cd "$RUNNER_TEMP/rep"
          git init -q && git checkout -q -b ci-logs
          git add latest.txt && git -c user.name=github-actions -c user.email=actions@github.com commit -q -m "apple $GITHUB_SHA [skip ci]"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-logs

      - name: Foutenoverzicht
        if: always()
        run: |
          echo "## Apple-build" >> $GITHUB_STEP_SUMMARY
          echo "- iOS/iPadOS: ${{ steps.ios.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- tvOS: ${{ steps.tvos.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- macOS: ${{ steps.macos.outcome }}" >> $GITHUB_STEP_SUMMARY
          for f in ios tvos macos; do
            echo "=== $f errors ==="
            grep -E "error:" $f.log | sort -u | head -200 || true
          done

      - name: Status
        if: steps.ios.outcome != 'success' || steps.tvos.outcome != 'success' || steps.macos.outcome != 'success'
        run: exit 1

  # Xcode-zip uploaden vanaf Ubuntu (FTPS vanaf macOS-runners lukt niet). De zip is de map apple/ met het
  # door de job build gecommitte Tunr.xcodeproj, dus er hoeft niets tussen de jobs te worden doorgegeven.
  upload:
    needs: build
    if: needs.build.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: lftp installeren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp rsync zip >/dev/null
      - name: Xcode-zip naar beheer.tunr.online (Downloads)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.BEHEER_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.BEHEER_FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ] || [ -z "$FTP_SERVER" ]; then
            echo "::warning::Secrets BEHEER_FTP_USERNAME/BEHEER_FTP_PASSWORD (of FTP_SERVER) ontbreken: Xcode-zip niet naar beheer.tunr.online geüpload."
            exit 0
          fi
          V=$(grep -m1 'MARKETING_VERSION' apple/project.yml | grep -o '[0-9][0-9.]*')
          B=$(grep -m1 'CURRENT_PROJECT_VERSION' apple/project.yml | grep -o '[0-9]\+')
          ZIP="$RUNNER_TEMP/Tunr-$V-build$B-Xcode.zip"
          # uitpakken geeft één map "Tunr" met Tunr.xcodeproj erin: dubbelklikken en bouwen
          rm -rf "$RUNNER_TEMP/pkg" "$ZIP" && mkdir -p "$RUNNER_TEMP/pkg"
          rsync -a --exclude 'build/' --exclude 'xcuserdata/' --exclude '.DS_Store' --exclude '*.log' --exclude 'destinations.txt' apple/ "$RUNNER_TEMP/pkg/Tunr/"
          (cd "$RUNNER_TEMP/pkg" && zip -qry "$ZIP" Tunr)
          unzip -l "$ZIP" | grep -m1 'Tunr.xcodeproj/project.pbxproj'
          ls -lh "$ZIP"
          awk -v b="Build $B" '/^## /{f=($0 ~ ("^## " b "( |$)"))?1:0; next} f' CHANGELOG.md 2>/dev/null | head -60 > "$RUNNER_TEMP/notes.md" || true
          [ -s "$RUNNER_TEMP/notes.md" ] || echo "Compleet Xcode-project voor iPhone, iPad, Mac en Apple TV (+ CarPlay). Uitpakken en Tunr/Tunr.xcodeproj openen." > "$RUNNER_TEMP/notes.md"
          # upload-script uit tunr-beheer (openbaar, anoniem op te halen); ftps.sh alleen als het er is
          TOOLS="$RUNNER_TEMP/beheer-tools"; rm -rf "$TOOLS"; mkdir -p "$TOOLS"
          RAW="https://raw.githubusercontent.com/LRvdLinden/tunr-beheer/main/tools"
          curl -fsSL --retry 3 "$RAW/beheer_upload.sh" -o "$TOOLS/beheer_upload.sh"
          curl -fsSL --retry 3 "$RAW/ftps.sh" -o "$TOOLS/ftps.sh" || { echo "geen tools/ftps.sh in tunr-beheer (niet nodig)"; rm -f "$TOOLS/ftps.sh"; }
          chmod +x "$TOOLS"/*.sh
          bash "$TOOLS/beheer_upload.sh" apple "$ZIP" "$V" "$B" "$RUNNER_TEMP/notes.md"
          echo "- Xcode-zip build $B → beheer.tunr.online (Downloads)" >> $GITHUB_STEP_SUMMARY

