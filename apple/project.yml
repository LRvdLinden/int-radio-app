# Tunr: één Xcode-project met één multiplatform-target (iPhone, iPad, Mac, Apple TV) + CarPlay-scene.
# Niet in Xcode zelf wijzigen: pas dit bestand aan en draai `xcodegen generate` (de workflow Apple doet dit ook
# en commit apple/Tunr.xcodeproj).
name: Tunr
options:
  bundleIdPrefix: nl.lrvdlinden
  developmentLanguage: en
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    # Versie blijft 1.0.0; alleen het buildnummer gaat omhoog (zie CLAUDE.md)
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "17"
    # Team van Léon van der Linden; automatisch ondertekenen voor iOS, tvOS en macOS
    DEVELOPMENT_TEAM: EU3UY476T6
    CODE_SIGN_STYLE: Automatic

targets:
  Tunr:
    type: application
    # Eén target voor iPhone/iPad (iOS), Apple TV (tvOS) en de Mac (native macOS, geen Catalyst)
    supportedDestinations: [iOS, tvOS, macOS]
    sources:
      # alle Swift-code, Assets.xcassets en Resources (Localizable.strings, tunr_tune.m4a)
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.lrvdlinden.tunr
        PRODUCT_NAME: Tunr
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TVOS_DEPLOYMENT_TARGET: "17.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_IDENTITY: "Apple Development"

        # Info.plist per SDK (handgeschreven, in Config/ = geen bronmap)
        INFOPLIST_FILE: Config/Info-iOS.plist
        "INFOPLIST_FILE[sdk=iphoneos*]": Config/Info-iOS.plist
        "INFOPLIST_FILE[sdk=iphonesimulator*]": Config/Info-iOS.plist
        "INFOPLIST_FILE[sdk=appletvos*]": Config/Info-tvOS.plist
        "INFOPLIST_FILE[sdk=appletvsimulator*]": Config/Info-tvOS.plist
        "INFOPLIST_FILE[sdk=macosx*]": Config/Info-macOS.plist

        # Entitlements per SDK.
        # CarPlay: zodra Apple de entitlement com.apple.developer.carplay-audio heeft toegekend
        # (aanvragen via developer.apple.com/contact/carplay) zet je hieronder
        #   TUNR_CARPLAY: "YES"
        #   TUNR_IOS_ENTITLEMENTS: Config/Tunr-CarPlay.entitlements
        # De code en de CarPlay-scene zitten er al in; zonder entitlement bouwt en draait de app gewoon.
        TUNR_CARPLAY: "NO"
        TUNR_IOS_ENTITLEMENTS: Config/Tunr-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS: Config/Tunr-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": $(TUNR_IOS_ENTITLEMENTS)
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Config/Tunr-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=appletvos*]": Config/Tunr-tvOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=appletvsimulator*]": Config/Tunr-tvOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Config/Tunr-macOS.entitlements

        # App-icoon per SDK (gemaakt met tools/make_icons.py)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=appletv*]": "App Icon & Top Shelf Image"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

        # Apparaatfamilies: iPhone + iPad, Apple TV
        "TARGETED_DEVICE_FAMILY[sdk=iphone*]": "1,2"
        "TARGETED_DEVICE_FAMILY[sdk=appletv*]": "3"

        # Geen Catalyst / "Designed for iPad" / Vision Pro: de Mac heeft de native macOS-build
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

        # Mac: hardened runtime (sandbox staat in de entitlements)
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "$(inherited) @executable_path/../Frameworks"
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "Apple Development"

# Gedeeld scheme (staat in Tunr.xcodeproj/xcshareddata): bovenin Xcode kies je hiermee iPhone, iPad, Mac of Apple TV
schemes:
  Tunr:
    build:
      targets:
        Tunr: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
